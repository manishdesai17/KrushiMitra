spring.application.name=krushimitra-api

server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/krushimitra}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.jwt.secret=${JWT_SECRET:dev-only-krushimitra-secret-change-before-deploy}
app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,capacitor://localhost,http://localhost}
app.market.api-key=${MARKET_DATA_API_KEY:}

