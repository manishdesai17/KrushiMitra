services:
  postgres:
    image: postgres:17-alpine
    container_name: krushimitra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-krushimitra}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - krushimitra-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-krushimitra}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  krushimitra-postgres-data: