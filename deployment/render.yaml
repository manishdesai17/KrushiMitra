services:
  - type: web
    name: krushimitra-api
    runtime: docker
    dockerfilePath: ../backend/Dockerfile
    healthCheckPath: /api/auth/me
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ALLOWED_ORIGINS
        sync: false
